name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check game.zip is present
        run: |
          test -f game.zip || { echo "game.zip is missing from the repo root"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Android SDK pieces
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Download Ruffle (web build)
        run: |
          mkdir -p ruffle-dl && cd ruffle-dl
          npm pack @ruffle-rs/ruffle
          tar xzf ./*.tgz
          R=$(find . -name ruffle.js | head -1)
          test -n "$R" || { echo "ruffle.js not found in npm package"; exit 1; }
          mkdir -p ../app/src/main/assets/www/ruffle
          cp -r "$(dirname "$R")"/. ../app/src/main/assets/www/ruffle/
          ls ../app/src/main/assets/www/ruffle

      - name: Unpack the game
        run: |
          G=app/src/main/assets/www/game
          mkdir -p "$G"
          unzip -q game.zip -d "$G"
          F=$(find "$G" -name main.swf | head -1)
          test -n "$F" || { echo "main.swf not found inside game.zip"; exit 1; }
          D=$(dirname "$F")
          if [ "$D" != "$G" ]; then cp -r "$D"/. "$G"/; fi
          ls "$G"

      - name: Generate Android project
        run: |
          mkdir -p app/src/main/java/com/example/finnandbones app/src/main/res/drawable

          cat > settings.gradle <<'EOF_SETTINGS'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "FinnAndBones"
          include ':app'
          EOF_SETTINGS

          cat > build.gradle <<'EOF_ROOT'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF_ROOT

          cat > app/build.gradle <<'EOF_APP'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.example.finnandbones'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.example.finnandbones'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF_APP

          cat > app/src/main/AndroidManifest.xml <<'EOF_MANIFEST'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="Finn and Bones"
                  android:allowBackup="false"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout|density|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_MANIFEST

          if [ -f icon.jpg ]; then
            mkdir -p app/src/main/res/mipmap-nodpi app/src/main/res/mipmap-anydpi-v26 app/src/main/res/drawable-nodpi
            cp icon.jpg app/src/main/res/mipmap-nodpi/ic_launcher.jpg
            cp icon.jpg app/src/main/res/drawable-nodpi/ic_icon_bg.jpg
            printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">' ' <background android:drawable="@drawable/ic_icon_bg" />' ' <foreground android:drawable="@android:color/transparent" />' '</adaptive-icon>' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
            sed -i 's|android:label="Finn and Bones"|android:label="Finn and Bones" android:icon="@mipmap/ic_launcher"|' app/src/main/AndroidManifest.xml
          fi

          cat > app/src/main/java/com/example/finnandbones/MainActivity.java <<'EOF_JAVA'
          package com.example.finnandbones;

          import android.app.Activity;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import java.io.ByteArrayInputStream;
          import java.io.InputStream;
          import java.util.HashMap;
          import java.util.Map;

          import org.json.JSONObject;

          public class MainActivity extends Activity {
              private static final String HOST = "game.local";
              private WebView web;

              private void dbg(final String m) {
                  runOnUiThread(new Runnable() {
                      @Override
                      public void run() {
                          if (web != null) {
                              web.evaluateJavascript("window.dbg&&window.dbg(" + JSONObject.quote(m) + ")", null);
                          }
                      }
                  });
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);

                  web = new WebView(this);
                  web.setBackgroundColor(0xFF000000);
                  setContentView(web);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setAllowFileAccess(false);

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          Uri u = request.getUrl();
                          if (!HOST.equals(u.getHost())) {
                              dbg("EXTERNAL " + u);
                              return null;
                          }
                          String path = u.getPath();
                          if (path == null || path.equals("/")) {
                              path = "/index.html";
                          }
                          Map<String, String> headers = new HashMap<>();
                          headers.put("Access-Control-Allow-Origin", "*");
                          try {
                                        InputStream in;
                              try {
                                  in = getAssets().open("www" + path);
                              } catch (Exception first) {
                                  in = getAssets().open("www/game" + path);
                                  path = "/game" + path;
                              }
                              if (!path.startsWith("/ruffle/") && !path.endsWith(".mp3")) {
                                  dbg("GET " + path);
                              }
                              return new WebResourceResponse(mime(path), null, 200, "OK", headers, in);
                          } catch (Exception e) {
                              dbg("404 " + path);
                              return new WebResourceResponse("text/plain", "utf-8", 404, "Not Found",
                                      headers, new ByteArrayInputStream(new byte[0]));
                          }
                      }
                  });

                  web.loadUrl("https://" + HOST + "/index.html");
              }

              private static String mime(String p) {
                  String l = p.toLowerCase();
                  if (l.endsWith(".html")) return "text/html";
                  if (l.endsWith(".js") || l.endsWith(".mjs")) return "text/javascript";
                  if (l.endsWith(".wasm")) return "application/wasm";
                  if (l.endsWith(".swf")) return "application/x-shockwave-flash";
                  if (l.endsWith(".mp3")) return "audio/mpeg";
                  if (l.endsWith(".json") || l.endsWith(".map")) return "application/json";
                  if (l.endsWith(".css")) return "text/css";
                  if (l.endsWith(".txt") || l.endsWith(".csv")) return "text/plain";
                  return "application/octet-stream";
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {
                      getWindow().getDecorView().setSystemUiVisibility(
                              View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                              | View.SYSTEM_UI_FLAG_FULLSCREEN
                              | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                              | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                              | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                              | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION);
                  }
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  web.onPause();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  web.onResume();
              }

              @Override
              protected void onDestroy() {
                  web.destroy();
                  super.onDestroy();
              }
          }
          EOF_JAVA

          cat > app/src/main/assets/www/index.html <<'EOF_HTML'
          <!doctype html>
          <html>
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
          <style>
            html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
            #c { position: fixed; top: 0; left: 0; right: 0; bottom: 0; }
            #dbg { position: fixed; left: 0; top: 0; right: 0; max-height: 60%; overflow: hidden; z-index: 99999;
                   pointer-events: none; color: #0f0; background: rgba(0,0,0,0.65); font: 11px monospace;
                   white-space: pre-wrap; padding: 2px; }
          </style>
          <script>
            var DBG = [];
            setTimeout(function () { var d = document.getElementById("dbg"); if (d) d.style.display = "none"; }, 20000);
            window.dbg = function (m) {
              DBG.push(String(m));
              if (DBG.length > 30) DBG.shift();
              var d = document.getElementById("dbg");
              if (d) d.textContent = DBG.join("\n");
            };
            ["log", "info", "warn", "error"].forEach(function (k) {
              var o = console[k];
              console[k] = function () {
                try { window.dbg(k + ": " + Array.prototype.slice.call(arguments).join(" ").slice(0, 300)); } catch (e) {}
                o.apply(console, arguments);
              };
            });
            window.addEventListener("error", function (e) {
              window.dbg("ERR " + (e.message || (e.target && (e.target.src || e.target.href))));
            }, true);
            window.addEventListener("unhandledrejection", function (e) { window.dbg("REJ " + e.reason); });
            window.RufflePlayer = window.RufflePlayer || {};
            window.RufflePlayer.config = {
              publicPath: "https://game.local/ruffle/",
              autoplay: "on",
              unmuteOverlay: "hidden",
              letterbox: "on",
              splashScreen: false,
              warnOnUnsupportedContent: false,
              contextMenu: "off",
              maxExecutionDuration: 60,
              logLevel: "info"
            };
          </script>
          <script src="https://game.local/ruffle/ruffle.js"></script>
          </head>
          <body>
          <div id="c"></div>
          <div id="dbg"></div>
          <script>
            window.addEventListener("load", function () {
              try {
                var ruffle = window.RufflePlayer.newest();
                window.dbg("Ruffle version: " + ruffle.version);
                var player = ruffle.createPlayer();
                player.style.width = "100%";
                player.style.height = "100%";
                document.getElementById("c").appendChild(player);
                var p = player.load({ url: "https://game.local/game/main.swf", base: "https://game.local/game/" });
                if (p && p.catch) p.catch(function (e) { window.dbg("LOAD FAILED: " + e); });
              } catch (e) {
                window.dbg("STARTUP ERROR: " + e);
              }
            });
          </script>
          </body>
          </html>
          EOF_HTML

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk FinnAndBones.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FinnAndBones-apk
          path: FinnAndBones.apk

      - name: Publish as a release (direct download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_id }}" FinnAndBones.apk \
            --title "Finn and Bones APK #${{ github.run_number }}" \
            --notes "Debug-signed build. Install FinnAndBones.apk on your phone."
